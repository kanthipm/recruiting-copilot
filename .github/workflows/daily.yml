name: daily

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 8am ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # keep the full database between runs so date_found and statuses persist
      - uses: actions/cache@v4
        with:
          path: data/recruiting.db
          key: recruiting-db-${{ github.run_id }}
          restore-keys: recruiting-db-

      - run: python run.py daily

      - name: commit slim db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.db
          git diff --cached --quiet || git commit -m "daily refresh $(date -u +%Y-%m-%d)"
          git push
